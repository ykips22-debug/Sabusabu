<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>사부 차트 비기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background:#0b0f17; color:#e5e7eb; font-family:system-ui; -webkit-tap-highlight-color:transparent; }
    .card { background:#1f2937; border:1px solid #374151; border-radius:12px; }
    .btn-primary { background:#2563eb; color:white; padding:14px 20px; border-radius:10px; font-weight:bold; width:100%; font-size:16px; }
    .btn-primary:disabled { background:#4b5563; }
    .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; font-weight:bold; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // CORS 프록시 사용 (업비트 API 직접 호출 불가)
    const PROXY = 'https://corsproxy.io/?';
    const BASE = 'https://api.upbit.com/v1';
    const API_URL = PROXY + BASE;

    async function fetchWithRetry(url, retries = 3) {
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } catch (e) {
          if (i === retries - 1) throw e;
          await new Promise(r => setTimeout(r, 1000 * (i + 1)));
        }
      }
    }

    async function fetchKRWMarkets() {
      const data = await fetchWithRetry(`${API_URL}/market/all`);
      return data.filter(m => m.market.startsWith('KRW-'));
    }

    async function fetchCandles(market, unit, count = 200, minutes) {
      const path = unit === 'days'
        ? `${API_URL}/candles/days?market=${market}&count=${count}`
        : `${API_URL}/candles/minutes/${minutes}?market=${market}&count=${count}`;
      const raw = await fetchWithRetry(path);
      return raw.map(c => ({
        timestamp: new Date(c.candle_date_time_kst).getTime(),
        open: c.open_price, high: c.high_price, low: c.low_price, close: c.trade_price,
        volume: c.candle_acc_trade_volume, value: c.candle_acc_trade_price
      })).reverse();
    }

    async function fetchTickers(markets) {
      const chunk = markets.slice(0, 100).join(',');
      return await fetchWithRetry(`${API_URL}/ticker?markets=${chunk}`);
    }

    function sma(values, period) {
      const out = [];
      for (let i = 0; i < values.length; i++) {
        if (i + 1 < period) { out.push(null); continue; }
        let sum = 0;
        for (let j = i - period + 1; j <= i; j++) sum += values[j];
        out.push(sum / period);
      }
      return out;
    }

    function cmf(candles, period = 20) {
      if (candles.length < period) return null;
      const slice = candles.slice(-period);
      let mfvSum = 0, volSum = 0;
      for (const c of slice) {
        const mfm = ((c.close - c.low) - (c.high - c.close)) / (c.high - c.low || 1);
        mfvSum += mfm * c.volume;
        volSum += c.volume;
      }
      return volSum === 0 ? null : mfvSum / volSum;
    }

    function analyze(candles1D, candles1H, candles15M) {
      const extract = (candles) => {
        if (!candles || candles.length === 0) return null;
        const closes = candles.map(c => c.close);
        return {
          current: candles[candles.length-1].close,
          sma10: candles.length >= 10 ? sma(closes, 10)[closes.length-1] : '미확인',
          sma20: candles.length >= 20 ? sma(closes, 20)[closes.length-1] : '미확인',
          sma240: candles.length >= 240 ? sma(closes, 240)[closes.length-1] : '미확인',
          cmf: cmf(candles) !== null ? cmf(candles).toFixed(3) : '미확인'
        };
      };
      const d1 = extract(candles1D), h1 = extract(candles1H), m15 = extract(candles15M);

      let g1 = { rr: '미확인', target: '미확인', stop: '미확인' };
      if (candles1H && candles1H.length >= 20) {
        const highs = candles1H.slice(-20).map(c => c.high);
        const lows = candles1H.slice(-10).map(c => c.low);
        const current = candles1H[candles1H.length-1].close;
        const target = Math.max(...highs);
        const stop = Math.min(...lows);
        const rr = current !== stop ? ((target - current) / (current - stop)).toFixed(2) : '미확인';
        g1 = { rr, target: target.toLocaleString(), stop: stop.toLocaleString() };
      }

      let g3 = { status: '미확인', reason: '데이터 부족' };
      if (d1 && d1.cmf !== '미확인') {
        const val = parseFloat(d1.cmf);
        if (val < 0) g3 = { status: 'A 등급 금지', reason: `일봉 CMF ${val} < 0` };
        else if (val < 0.1) g3 = { status: '조건부', reason: `CMF ${val} (0~0.1)` };
        else g3 = { status: '통과', reason: `CMF ${val} > 0.1` };
      }

      let g5 = { status: '미확인', pos: '미확인' };
      if (candles1H && candles1H.length >= 50) {
        const H = Math.max(...candles1H.slice(-50).map(c => c.high));
        const L = Math.min(...candles1H.slice(-50).map(c => c.low));
        const current = candles1H[candles1H.length-1].close;
        const pos = (current - L) / (H - L);
        const posPct = (pos * 100).toFixed(0);
        if (pos >= 0.25 && pos <= 0.75) g5 = { status: '진입 금지', pos: `중간 ${posPct}%` };
        else g5 = { status: '통과', pos: pos < 0.25 ? `하단 ${posPct}%` : `상단 ${posPct}%` };
      }

      const cf = {
        CF1: '미확인', CF2: '통과', CF3: '미확인', CF4: '통과', CF5: '미확인',
        CF6: g5.status === '진입 금지' ? '해당 (G5 중간 50%)' : '통과',
        CF7: '통과'
      };

      let grade = 'C';
      if (cf.CF6.includes('해당')) grade = 'D';
      else if (g1.rr !== '미확인' && parseFloat(g1.rr) < 2) grade = 'C';
      else if (g3.status === 'A 등급 금지') grade = 'C';
      else if (g1.rr !== '미확인' && parseFloat(g1.rr) >= 2 && g3.status !== 'A 등급 금지') grade = 'B';

      const entryStatus = grade === 'D' ? '진입 금지' : (grade === 'B' ? '조건부' : '진입 금지');
      return { grade, entryStatus, d1, h1, m15, g1, g3, g5, cf };
    }

    function Chart({ candles, title }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ref.current || !candles || candles.length === 0) return;
        const chart = window.LightweightCharts.createChart(ref.current, {
          layout: { background: { color: '#1f2937' }, textColor: '#e5e7eb' },
          grid: { vertLines: { color: '#374151' }, horzLines: { color: '#374151' } },
          width: ref.current.clientWidth, height: 220,
          timeScale: { timeVisible: true, secondsVisible: false }
        });
        const cs = chart.addCandlestickSeries({
          upColor: '#22c55e', downColor: '#ef4444',
          borderUpColor: '#22c55e', borderDownColor: '#ef4444',
          wickUpColor: '#22c55e', wickDownColor: '#ef4444'
        });
        cs.setData(candles.map(c => ({ time: Math.floor(c.timestamp / 1000), open: c.open, high: c.high, low: c.low, close: c.close })));
        const closes = candles.map(c => c.close);
        const sma10 = sma(closes, 10);
        const line = chart.addLineSeries({ color: '#f59e0b', lineWidth: 1 });
        line.setData(candles.map((c, i) => ({ time: Math.floor(c.timestamp / 1000), value: sma10[i] })).filter(d => d.value !== null));
        chart.timeScale().fitContent();
        const resize = () => chart.applyOptions({ width: ref.current.clientWidth });
        window.addEventListener('resize', resize);
        return () => { window.removeEventListener('resize', resize); chart.remove(); };
      }, [candles, title]);
      return (
        <div className="mb-4">
          <div className="text-sm font-bold text-blue-400 mb-1">{title}</div>
          <div ref={ref} className="rounded overflow-hidden"></div>
        </div>
      );
    }

    function App() {
      const [status, setStatus] = useState('idle');
      const [errorMsg, setErrorMsg] = useState('');
      const [candidates, setCandidates] = useState([]);
      const [selected, setSelected] = useState(null);
      const [analysis, setAnalysis] = useState(null);
      const [chartsData, setChartsData] = useState({});
      const [lastScan, setLastScan] = useState('-');
      const [showDetail, setShowDetail] = useState(false);

      const runScan = async () => {
        setStatus('loading');
        setErrorMsg('');
        setCandidates([]);
        setSelected(null);
        setShowDetail(false);
        try {
          const markets = await fetchKRWMarkets();
          const tickers = await fetchTickers(markets.slice(0, 50).map(m => m.market));
          const results = [];
          for (let i = 0; i < 30; i += 5) {
            const batch = markets.slice(i, i + 5);
            const promises = batch.map(async (m) => {
              const ticker = tickers.find(t => t.market === m.market);
              if (!ticker || ticker.acc_trade_price_24h < 1000000000) return null;
              try {
                const [c1H, c15M] = await Promise.all([
                  fetchCandles(m.market, 'minutes', 100, 60),
                  fetchCandles(m.market, 'minutes', 100, 15)
                ]);
                const closes1H = c1H.map(c => c.close);
                const sma10_1H = sma(closes1H, 10);
                const lastClose = closes1H[closes1H.length - 1];
                const lastSma10 = sma10_1H[sma10_1H.length - 1];
                if (!lastSma10) return null;
                const isUptrend = lastClose > lastSma10;
                const H = Math.max(...c1H.slice(-30).map(c => c.high));
                const L = Math.min(...c1H.slice(-30).map(c => c.low));
                const pos = (lastClose - L) / (H - L);
                if (isUptrend && (pos < 0.3 || pos > 0.7)) {
                  return {
                    market: m.market, name: m.korean_name,
                    price: ticker.trade_price,
                    change: (ticker.signed_change_rate * 100).toFixed(2),
                    value: (ticker.acc_trade_price_24h / 100000000).toFixed(1) + '억',
                    pos: pos < 0.3 ? '하단' : '상단'
                  };
                }
              } catch (e) { return null; }
            });
            const batchResults = await Promise.all(promises);
            results.push(...batchResults.filter(r => r !== null));
          }
          setCandidates(results.slice(0, 20));
          setLastScan(new Date().toLocaleString());
          setStatus('ok');
        } catch (e) {
          setErrorMsg('API 오류: ' + e.message);
          setStatus('error');
        }
      };

      const selectCandidate = async (c) => {
        setSelected(c);
        setAnalysis(null);
        setShowDetail(true);
        try {
          const [c1D, c4H, c1H, c15M, c5M] = await Promise.all([
            fetchCandles(c.market, 'days', 200),
            fetchCandles(c.market, 'minutes', 200, 240),
            fetchCandles(c.market, 'minutes', 200, 60),
            fetchCandles(c.market, 'minutes', 200, 15),
            fetchCandles(c.market, 'minutes', 200, 5)
          ]);
          setChartsData({ '1D': c1D, '4H': c4H, '1H': c1H, '15M': c15M, '5M': c5M });
          setAnalysis(analyze(c1D, c1H, c15M));
        } catch (e) {
          setErrorMsg('상세 데이터 로딩 패: ' + e.message);
        }
      };

      return (
        <div className="max-w-2xl mx-auto p-3 pb-20">
          <header className="mb-4">
            <h1 className="text-xl font-bold text-white">📈 사부 차트 비기</h1>
            <p className="text-gray-400 text-xs">업비트 KRW 자동 분석기</p>
            <div className="flex flex-wrap gap-2 mt-2 text-xs">
              <span className="badge bg-gray-700">API: <b className={status==='ok'?'text-green-400':status==='error'?'text-red-400':'text-yellow-400'}>{status}</b></span>
              <span className="badge bg-gray-700">후보: {candidates.length}</span>
              <span className="badge bg-gray-700">스캔: {lastScan}</span>
            </div>
            {errorMsg && <div className="mt-2 text-red-400 bg-red-900/30 p-2 rounded text-xs">⚠️ {errorMsg}</div>}
          </header>

          <button onClick={runScan} disabled={status==='loading'} className="btn-primary">
            {status === 'loading' ? '🔄 스캔 중...' : '🔍 전체 스캔 시작'}
          </button>

          {candidates.length > 0 && !showDetail && (
            <div className="mt-4">
              <h2 className="text-sm font-bold mb-2">1차 후보</h2>
              <div className="space-y-2">
                {candidates.map(c => (
                  <div key={c.market} onClick={() => selectCandidate(c)}
                    className="card p-3 active:bg-gray-600 cursor-pointer">
                    <div className="flex justify-between items-start">
                      <div>
                        <div className="font-bold text-white">{c.name}</div>
                        <div className="text-xs text-gray-400">{c.market}</div>
                      </div>
                      <div className="text-right">
                        <div className="text-sm font-bold">{c.price.toLocaleString()}</div>
                        <div className={`text-xs ${c.change > 0 ? 'text-green-400' : 'text-red-400'}`}>{c.change}%</div>
                      </div>
                    </div>
                    <div className="mt-2 flex gap-2 text-xs">
                      <span className="badge bg-blue-900 text-blue-300">{c.value}</span>
                      <span className="badge bg-yellow-900 text-yellow-300">{c.pos}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {analysis && selected && showDetail && (
            <div className="mt-4">
              <button onClick={() => setShowDetail(false)} className="text-blue-400 text-sm mb-3">← 목록으로</button>
              <h2 className="text-lg font-bold mb-3 text-white">{selected.name}</h2>

              <div className="card p-3 mb-4">
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div>
                    <div className="text-gray-400 text-xs">등급</div>
                    <div className={`text-2xl font-bold ${analysis.grade==='B'?'text-blue-400':analysis.grade==='C'?'text-yellow-400':'text-red-500'}`}>{analysis.grade}</div>
                  </div>
                  <div>
                    <div className="text-gray-400 text-xs">진입</div>
                    <div className="text-sm font-bold text-white mt-1">{analysis.entryStatus}</div>
                  </div>
                  <div>
                    <div className="text-gray-400 text-xs">R/R</div>
                    <div className="text-sm font-bold text-green-400 mt-1">{analysis.g1.rr}</div>
                  </div>
                </div>
              </div>

              <div className="space-y-3 mb-4">
                {Object.entries(chartsData).map(([tf, data]) => (
                  <Chart key={tf} candles={data} title={`${tf} · ${data[data.length-1]?.close.toLocaleString()}원`} />
                ))}
              </div>

              <div className="card p-3 mb-3 overflow-x-auto">
                <h3 className="font-bold mb-2 text-blue-400 text-sm">📊 데이터 검증</h3>
                <table className="w-full text-xs">
                  <thead className="text-gray-400 border-b border-gray-600">
                    <tr><th className="p-1 text-left">TF</th><th className="p-1">현재가</th><th className="p-1">10SMA</th><th className="p-1">CMF</th></tr>
                  </thead>
                  <tbody>
                    {['d1', 'h1', 'm15'].map(key => {
                      const d = analysis[key];
                      const label = key === 'd1' ? '1D' : key === 'h1' ? '1H' : '15M';
                      if (!d) return null;
                      return (
                        <tr key={key} className="border-b border-gray-700">
                          <td className="p-1 font-bold">{label}</td>
                          <td className="p-1 text-center">{d.current?.toLocaleString()}</td>
                          <td className="p-1 text-center text-yellow-400">{typeof d.sma10 === 'number' ? d.sma10.toLocaleString() : d.sma10}</td>
                          <td className={`p-1 text-center ${parseFloat(d.cmf) < 0 ? 'text-red-400' : 'text-green-400'}`}>{d.cmf}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              <div className="card p-3 mb-3">
                <h3 className="font-bold mb-2 text-red-400 text-sm">🚨 Critical Fail</h3>
                <div className="space-y-1 text-xs">
                  {Object.entries(analysis.cf).map(([k, v]) => (
                    <div key={k} className="flex justify-between border-b border-gray-700 pb-1">
                      <span>{k}</span>
                      <span className={v.includes('해당') ? 'text-red-500 font-bold' : 'text-green-400'}>{v}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="card p-3">
                <h3 className="font-bold mb-2 text-blue-400 text-sm">📌 최종 판단</h3>
                <div className="text-xs space-y-1">
                  <div><b>G1 목표:</b> {analysis.g1.target}원</div>
                  <div><b>G1 손절:</b> {analysis.g1.stop}원</div>
                  <div><b>G3:</b> {analysis.g3.status}</div>
                  <div><b>G5:</b> {analysis.g5.status} ({analysis.g5.pos})</div>
                </div>
                <div className="mt-3 p-2 bg-yellow-900/30 rounded text-yellow-300 text-xs">
                  ⚠️ 실제 데이터 기반 자동 분석이며 투자 권유가 아닙니다.
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
